services:
  - type: web
    name: paradesk-core
    env: python
    region: singapore # Closest to India / IIT Madras
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: true

