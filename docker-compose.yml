version: '3.8'

services:
  paradesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paradesk-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=paradesk-paradox27-production-secret-change-me
      - SECURE_COOKIES=false
      - DB_PATH=/app/data/paradesk.db
    volumes:
      - paradesk_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  paradesk_data:
    driver: local

